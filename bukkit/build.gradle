import groovy.json.JsonSlurper

plugins {
    id 'java'
}

apply plugin: 'com.gradleup.shadow'
apply plugin: 'com.modrinth.minotaur'
apply plugin: 'de.maxhenkel.cursegradle'
apply plugin: 'io.papermc.hangar-publish-plugin'
apply plugin: 'xyz.jpenilla.run-paper'

apply from: rootProject.file("mod.gradle")

def runtimeJar = project.findProperty('voicechatRuntimeJar')
        ?: System.getenv('VOICECHAT_RUNTIME_JAR')
def serverLibraries = project.findProperty('voicechatServerLibraries') ?: System.getenv('VOICECHAT_SERVER_LIBRARIES')

if (!runtimeJar || !serverLibraries) {
    throw new GradleException('Set VOICECHAT_RUNTIME_JAR and VOICECHAT_SERVER_LIBRARIES before building the Bukkit overlay')
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    mavenCentral()
    maven { url = 'https://libraries.minecraft.net/' }
    maven { url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
    maven { url = 'https://repo.viaversion.com/' }
}

dependencies {
    // The overlay build accepts the runtime paths as Gradle properties so the
    // source stays usable on Windows installations with non-ASCII directories.
    if (runtimeJar) compileOnly files(runtimeJar)
    if (serverLibraries) compileOnly fileTree(serverLibraries) { include '**/*.jar' }

    // These are compile-time dependencies of the Bukkit sources. The runtime
    // plugin contains their relocated classes; shadowJar keeps that ABI intact.
    compileOnly "de.maxhenkel.configbuilder:configbuilder:${configbuilder_version}"
    compileOnly "org.concentus:Concentus:${concentus_version}"
    compileOnly "me.lucko:commodore:2.2"
    compileOnly "me.clip:placeholderapi:2.11.7"
}

processResources {
    filesMatching('plugin.yml') {
        expand 'version': version
    }
}

sourceSets {
    template {
        java {
            srcDir 'src/template/java'
        }
    }
    main {
        compileClasspath += sourceSets.template.output
        runtimeClasspath += sourceSets.template.output
    }
}

tasks.register('generateBuildConstants', Copy) {
    from 'src/template/java'
    into "${layout.buildDirectory.asFile.get()}/generated/java"
    expand 'compatibility_version': voicechat_compatibility_version,
            'mod_compatible_version': mod_compatible_version,
            'target_bukkit_version': bukkit_version,
            'plugin_name': mod_display_name
}
compileJava.dependsOn generateBuildConstants

tasks.register('generateFallbackTranslations') {
    def inputFile = rootProject.file('common/src/main/resources/assets/voicechat/lang/en_us.json')
    def chineseFile = rootProject.file('common/src/main/resources/assets/voicechat/lang/zh_cn.json')
    def outputFile = file("${layout.buildDirectory.asFile.get()}/generated/java/de/maxhenkel/voicechat/FallbackTranslations.java")
    inputs.files inputFile, chineseFile
    outputs.file outputFile

    doLast {
        def json = new JsonSlurper().parse(inputFile) + new JsonSlurper().parse(chineseFile)
        json['argument.entity.notfound.player'] = '找不到该在线玩家。'
        json['message.voicechat.ping_received_attempt'] = '第 %2$s 次尝试收到回应，耗时 %1$s 毫秒。'
        outputFile.getParentFile().mkdirs()

        def stringBuilder = new StringBuilder()
        json.each { key, value ->
            def escapedKey = key.toString().replace('\\', '\\\\').replace('\n', '\\n').replace('"', '\\"')
            def escapedValue = value.toString().replace('\\', '\\\\').replace('\n', '\\n').replace('"', '\\"')
            stringBuilder.append("        translations.put(\"${escapedKey}\", \"${escapedValue}\");\n")
        }

        outputFile.text = """package de.maxhenkel.voicechat;

import java.util.Collections;
import java.util.HashMap;
import java.util.Map;

public class FallbackTranslations {

    public static final Map<String, String> FALLBACK_TRANSLATIONS;

    static {
        Map<String, String> translations = new HashMap<>();
${stringBuilder.toString()}
        FALLBACK_TRANSLATIONS = Collections.unmodifiableMap(translations);
    }
}
"""
    }
}
compileJava.dependsOn generateFallbackTranslations

// mod.gradle overlays included main sources on every JavaCompile task.
// Keep the test compiler limited to actual test sources.
tasks.named('compileTestJava', JavaCompile) {
    setSource(sourceSets.test.java)
}

tasks.register('pluginSelfTest', JavaExec) {
    dependsOn testClasses
    mainClass = 'de.maxhenkel.voicechat.plugins.PluginEventSnapshotSelfTest'
    classpath = sourceSets.test.runtimeClasspath + files(runtimeJar)
    if (serverLibraries) {
        classpath += fileTree(serverLibraries) { include '**/*.jar' }
    }
}

check.dependsOn(pluginSelfTest)

sourceSets.main.java {
    srcDir "${layout.buildDirectory.asFile.get()}/generated/java"
}

shadowJar {
    from(zipTree(runtimeJar)) {
        exclude 'META-INF/MANIFEST.MF'
    }
    relocate 'org.json', 'de.maxhenkel.voicechat.org.json'
    relocate 'com.google.gson', 'de.maxhenkel.voicechat.gson'
    relocate 'me.lucko.commodore', 'de.maxhenkel.voicechat.commodore'
    relocate 'org.concentus', 'de.maxhenkel.voicechat.concentus'
    dependencies {
        exclude(dependency('com.mojang:brigadier:.*'))
        exclude(dependency('com.google.code.findbugs:jsr305:.*'))
    }
}

tasks.register('copyJarToServer') {
    doLast {
        delete {
            delete "${projectDir}/run/plugins/${base.archivesName}-${version}.jar"
        }
        copy {
            from "${layout.buildDirectory.asFile.get()}/libs/${base.archivesName.get()}-${version}.jar"
            into "${projectDir}/run/plugins"
        }
    }
}

build.finalizedBy(copyJarToServer)

tasks.register('runBukkitServer') {
    doLast {
        javaexec {
            debug = true
            workingDir = "${projectDir}/run"
            main = '-jar';
            args = [
                    "${projectDir}/run/craftbukkit.jar",
                    'nogui'
            ]
        }
    }
}

tasks {
    runServer {
        minecraftVersion(minecraft_version)
    }
}

build.dependsOn(shadowJar)
runBukkitServer.dependsOn(build)
runServer.dependsOn(build)
